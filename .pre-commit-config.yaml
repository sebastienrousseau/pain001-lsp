repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

  # ruff and black match the versions poetry.lock pins, so the hooks
  # agree with `make lint`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        # Vendored and checksummed (see [tool.black] in pyproject.toml).
        exclude: ^tests/test_suite_conformance\.py$

  # Spelling, configured in pyproject.toml [tool.codespell]; the
  # docs-lint workflow runs the same check.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ['tomli; python_version < "3.11"']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ['--config-file=pyproject.toml']
        pass_filenames: false
        entry: mypy pain001_lsp/
