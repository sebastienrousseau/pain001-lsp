[tool.poetry]
name = "pain001-lsp"
version = "0.0.65"
description = "Language Server Protocol (LSP) server for authoring pain001 ISO 20022 Customer Credit Transfer Initiation data files."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/pain001-lsp"
homepage = "https://pain001.com"
packages = [
    { include = "pain001_lsp" },
]

[tool.poetry.scripts]
pain001-lsp = "pain001_lsp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pain001 = ">=0.0.55"
pygls = ">=2.1,<3"
jsonschema = ">=4.17,<5"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-benchmark = ">=5.0.0,<6.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.17"
mypy = ">=1.11,<3.0"
bandit = "^1.7.0"
interrogate = "^1.7.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere. Excluded as any generated file would be.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = [
    "benchmark: performance measurement or scaling guard",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    # Coverage runs on a plain local `pytest`, not only in CI. Without
    # these a developer sees green and learns otherwise from the build.
    # The floor itself is NOT restated here: pytest-cov honours
    # fail_under from [tool.coverage.report], so the number lives in
    # exactly one place.
    "--cov=pain001_lsp",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["pain001_lsp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["tests", "examples"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
# server.py uses bare ``dict`` return annotations for its plain-dict payloads;
# allow them rather than editing the vendored server module.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "pain001.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]

[[tool.mypy.overrides]]
module = "pygls.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lsprotocol.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
