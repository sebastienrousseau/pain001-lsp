version: 2
updates:
  # Dependabot resolves a pip job on one Python: for "/" the lowest that
  # pyproject.toml allows (3.10). audit.in and build.in are compiled for
  # 3.12 and floor filelock at 4.2.1, which needs 3.11, so from "/" any
  # update touching them fails with dependency_file_not_resolvable (as in
  # camt053-mcp and acmt001-mcp). "/" leaves the 3.12 sets (audit, build,
  # fuzz) to the second pip entry, which runs from /requirements, where
  # no pyproject.toml pins the Python and Dependabot uses its newest.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements/audit.*"
      - "requirements/build.*"
      - "requirements/fuzz.*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "python"
      # pain001 is hand-bumped in lockstep with the suite; Dependabot
      # would otherwise propose patch bumps that don't align with our
      # version-for-version release policy.
      - dependency-name: "pain001"

  # The sets compiled for Python 3.12; ci, docs and runtime stay with "/".
  - package-ecosystem: "pip"
    directory: "/requirements"
    exclude-paths:
      - "requirements/ci.*"
      - "requirements/docs.*"
      - "requirements/runtime.*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    ignore:
      - dependency-name: "pain001"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  # The Dockerfile pins python:3.12-slim by digest; this keeps the digest
  # current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
