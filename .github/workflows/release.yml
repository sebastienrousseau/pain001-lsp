# Release: build once, prove it, publish it. Same shape as pain001-mcp.
#
#   build           sdist + wheel, twine check, SLSA build provenance
#                   attestation (GitHub), keyless sigstore signatures
#   github-release  the distributions and their .sig/.pem on the release
#   pypi-publish    PyPI trusted publishing (OIDC), PEP 740 attestations
#   sbom            CycloneDX + SPDX of the installed package, attached
#
# Every action is pinned by commit SHA; Dependabot keeps the pins current.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build, attest and sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # sigstore keyless signing
      attestations: write   # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import sys; sys.path.insert(0,'.'); import pain001_lsp; print(pain001_lsp.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi

      - name: Install build tooling (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      # SLSA Build Level 3 provenance for every distribution file, bound to
      # the exact bytes just built and signed with the workflow's OIDC
      # identity. Verify with: gh attestation verify <file> --repo pain001-lsp
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"

      # Keyless signatures (Fulcio + Rekor), kept beside the distributions
      # rather than inside dist/ so the PyPI upload never sees them.
      - name: Sign distributions (keyless)
        run: |
          mkdir -p signatures
          for f in dist/*; do
            cosign sign-blob --yes \
              --output-signature "signatures/$(basename "$f").sig" \
              --output-certificate "signatures/$(basename "$f").pem" \
              "$f"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Upload signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Download signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signatures
          path: signatures/

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          files: |
            dist/*
            signatures/*

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pain001-lsp
    permissions:
      id-token: write       # PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          skip-existing: true

  sbom:
    name: SBOM (CycloneDX + SPDX)
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the SBOMs to the release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The SBOM describes what a user installs, so it is generated from a
      # clean environment holding exactly this package and its runtime
      # dependencies, not from the repository tree.
      # Runtime dependencies come hash-pinned from requirements/runtime.txt
      # and the package goes on as a --no-deps wheel, so the SBOM lists
      # exactly the pinned set.
      - name: Install the package into a clean environment
        run: |
          python -m venv .sbom-env
          .sbom-env/bin/pip install --require-hashes -r requirements/runtime.txt
          .sbom-env/bin/pip wheel --no-deps -w .sbom-wheels .
          .sbom-env/bin/pip install --no-deps .sbom-wheels/*.whl
          .sbom-env/bin/pip check

      - name: Generate SPDX SBOM (JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .sbom-env
          format: spdx-json
          output-file: "pain001-lsp-${{ env.RELEASE_TAG }}.spdx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM (JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .sbom-env
          format: cyclonedx-json
          output-file: "pain001-lsp-${{ env.RELEASE_TAG }}.cdx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOMs to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "pain001-lsp-${RELEASE_TAG}.spdx.json" \
            "pain001-lsp-${RELEASE_TAG}.cdx.json" \
            --repo "${{ github.repository }}" --clobber
