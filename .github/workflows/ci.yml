name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This repo builds with poetry-core and keeps a poetry.lock, but no
  # workflow installs from it — CI uses pip. So the lock could drift
  # indefinitely without anything noticing, and it had: by the time this
  # job was added it was already stale against pyproject.toml, and no
  # job had ever gone red over it.
  #
  # A lock nobody checks is worse than no lock, because anyone running
  # `poetry install` locally gets dependencies that no longer match what
  # the package declares.
  # The pip jobs below install against the live dependency range, which
  # is the right default for a library: it catches a new release of a
  # dependency breaking us. But it means poetry.lock is never exercised,
  # and a lock nobody installs from is a lock nobody can trust — which is
  # how it came to be silently stale before the `lockfile` job existed.
  #
  # Checking that the lock *parses* and matches pyproject is necessary
  # but not sufficient: it says nothing about whether the pinned set
  # actually works. This job installs exactly what the lock pins and runs
  # the suite against it, so the two jobs answer different questions:
  #
  #   locked  - do the pinned versions still work?  (reproducibility)
  #   test    - do the newest allowed versions work? (drift detection)
  locked:
    name: Test against the locked dependency set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install from poetry.lock
        run: poetry install --no-interaction

      - name: Run the suite against the pinned set
        run: poetry run pytest -q

  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install --require-hashes -r requirements/build.txt

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Run tests with the 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor all come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          # Only the XML report is CI-specific.
          pytest tests/ --cov-report=xml -v

      # The benchmark asserts no timing threshold -- wall-clock is not
      # comparable between runners, and a flaky perf gate teaches
      # people to ignore red. This proves it still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_diagnostics.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_lsp

      # The scaling guard compares the engine against itself at two
      # sizes, so it does not depend on how fast this runner is.
      - name: Benchmarks and scaling guard
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Ruff check
        run: ruff check pain001_lsp/ tests/ benches/ scripts/ fuzz/ examples/

      - name: Black check
        run: black --check pain001_lsp/ tests/ benches/ scripts/ fuzz/ examples/

      - name: Mypy
        run: mypy pain001_lsp/

      # Per-function ceilings (cyclomatic 10, cognitive 15, Halstead
      # difficulty 30, 60 lines; 500 lines per file) against
      # complexity-baseline.json, which may only shrink.
      - name: Complexity against the baseline
        run: python scripts/check_complexity.py

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Run examples
        run: |
          python examples/01_lsp_helpers.py
          python examples/02_quick_fix.py
          python examples/03_configure_message_type.py
          python examples/04_corpus_commands.py
