name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This repo builds with poetry-core and keeps a poetry.lock, but no
  # workflow installs from it — CI uses pip. So the lock could drift
  # indefinitely without anything noticing, and it had: by the time this
  # job was added it was already stale against pyproject.toml, and no
  # job had ever gone red over it.
  #
  # A lock nobody checks is worse than no lock, because anyone running
  # `poetry install` locally gets dependencies that no longer match what
  # the package declares.
  # The pip jobs below install against the live dependency range, which
  # is the right default for a library: it catches a new release of a
  # dependency breaking us. But it means poetry.lock is never exercised,
  # and a lock nobody installs from is a lock nobody can trust — which is
  # how it came to be silently stale before the `lockfile` job existed.
  #
  # Checking that the lock *parses* and matches pyproject is necessary
  # but not sufficient: it says nothing about whether the pinned set
  # actually works. This job installs exactly what the lock pins and runs
  # the suite against it, so the two jobs answer different questions:
  #
  #   locked  - do the pinned versions still work?  (reproducibility)
  #   test    - do the newest allowed versions work? (drift detection)
  locked:
    name: Test against the locked dependency set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install from poetry.lock
        run: poetry install --no-interaction

      - name: Run the suite against the pinned set
        run: poetry run pytest -q

  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          # Coordinated development: when a feat/* branch here has a
          # counterpart of the same name in pain001, build against it so
          # the pair can be tested before the core is released.
          #
          # This used to assume every feat/* branch had a counterpart, so
          # any feat/* branch without one died with "pathspec ... did not
          # match any file(s)". The fallback also pinned
          # pain001>=0.0.52,<0.0.54 while this package declares >=0.0.55.
          # Now the branch is used only if it exists, and the fallback
          # honours the floor in pyproject.toml.
          REF="${{ github.head_ref || github.ref_name }}"
          CORE=https://github.com/sebastienrousseau/pain001
          if [[ "$REF" == feat/* ]] && \
             git ls-remote --exit-code --heads "$CORE" "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            FLOOR=$(grep -E '^pain001 = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            pip install "pain001>=${FLOOR}"
          fi
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark interrogate

      - name: Run tests with the 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_lsp --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 -v

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_lsp

      # The scaling guard compares the engine against itself at two
      # sizes, so it does not depend on how fast this runner is.
      - name: Benchmarks and scaling guard
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          # Coordinated development: when a feat/* branch here has a
          # counterpart of the same name in pain001, build against it so
          # the pair can be tested before the core is released.
          #
          # This used to assume every feat/* branch had a counterpart, so
          # any feat/* branch without one died with "pathspec ... did not
          # match any file(s)". The fallback also pinned
          # pain001>=0.0.52,<0.0.54 while this package declares >=0.0.55.
          # Now the branch is used only if it exists, and the fallback
          # honours the floor in pyproject.toml.
          REF="${{ github.head_ref || github.ref_name }}"
          CORE=https://github.com/sebastienrousseau/pain001
          if [[ "$REF" == feat/* ]] && \
             git ls-remote --exit-code --heads "$CORE" "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            FLOOR=$(grep -E '^pain001 = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            pip install "pain001>=${FLOOR}"
          fi
          pip install -e .
          pip install ruff black mypy types-jsonschema

      - name: Ruff check
        run: ruff check pain001_lsp/ tests/

      - name: Black check
        run: black --check pain001_lsp/ tests/

      - name: Mypy
        run: mypy pain001_lsp/

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          # Coordinated development: when a feat/* branch here has a
          # counterpart of the same name in pain001, build against it so
          # the pair can be tested before the core is released.
          #
          # This used to assume every feat/* branch had a counterpart, so
          # any feat/* branch without one died with "pathspec ... did not
          # match any file(s)". The fallback also pinned
          # pain001>=0.0.52,<0.0.54 while this package declares >=0.0.55.
          # Now the branch is used only if it exists, and the fallback
          # honours the floor in pyproject.toml.
          REF="${{ github.head_ref || github.ref_name }}"
          CORE=https://github.com/sebastienrousseau/pain001
          if [[ "$REF" == feat/* ]] && \
             git ls-remote --exit-code --heads "$CORE" "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            FLOOR=$(grep -E '^pain001 = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            pip install "pain001>=${FLOOR}"
          fi
          pip install -e .

      - name: Run examples
        run: |
          python examples/01_lsp_helpers.py
          python examples/02_quick_fix.py
          python examples/03_configure_message_type.py
