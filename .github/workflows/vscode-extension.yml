# The VS Code extension: built and packaged on every change, attached to
# each release as a .vsix so it installs without the Marketplace, and
# published to the Marketplace when a VSCE_PAT secret exists (otherwise
# that one step is skipped and says so).
name: VS Code extension

on:
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    paths:
      - "editors/vscode/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Compile and package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .vsix to the release on a tag
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install and compile
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run compile

      - name: Version equals the package version
        run: |
          EXT=$(node -p "require('./package.json').version")
          PKG=$(grep -E '^__version__' ../../pain001_lsp/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "extension $EXT, pain001-lsp $PKG"
          [ "$EXT" = "$PKG" ] || { echo "::error::extension version $EXT differs from pain001-lsp $PKG"; exit 1; }

      - name: Package the .vsix
        run: npx --yes @vscode/vsce@3 package --no-dependencies

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: editors/vscode/*.vsix

      - name: Attach the .vsix to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" ./*.vsix --repo "${{ github.repository }}" --clobber

      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; the .vsix is on the release, Marketplace publishing skipped."
            exit 0
          fi
          npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath ./*.vsix
