name: Nightly Quality

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly check + coverage upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          # Coordinated development: when a feat/* branch here has a
          # counterpart of the same name in pain001, build against it so
          # the pair can be tested before the core is released.
          #
          # This used to assume every feat/* branch had a counterpart, so
          # any feat/* branch without one died with "pathspec ... did not
          # match any file(s)". The fallback also pinned
          # pain001>=0.0.52,<0.0.54 while this package declares >=0.0.55.
          # Now the branch is used only if it exists, and the fallback
          # honours the floor in pyproject.toml.
          REF="${{ github.head_ref || github.ref_name }}"
          CORE=https://github.com/sebastienrousseau/pain001
          if [[ "$REF" == feat/* ]] && \
             git ls-remote --exit-code --heads "$CORE" "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            FLOOR=$(grep -E '^pain001 = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            pip install "pain001>=${FLOOR}"
          fi
          pip install -e .
          pip install pytest pytest-cov interrogate ruff black mypy bandit pip-audit types-jsonschema

      - name: Full gate (lint + type + tests + interrogate + bandit + audit)
        run: |
          ruff check pain001_lsp/ tests/
          black --check pain001_lsp/ tests/
          mypy pain001_lsp/
          pytest tests/ --cov=pain001_lsp --cov-branch --cov-report=xml --cov-fail-under=100
          interrogate -c pyproject.toml pain001_lsp
          bandit -r pain001_lsp/ -ll
          pip-audit
