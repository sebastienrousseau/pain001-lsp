name: Nightly Quality

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly check + coverage upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Full gate (lint + type + tests + interrogate + bandit + audit)
        run: |
          ruff check pain001_lsp/ tests/
          black --check pain001_lsp/ tests/
          mypy pain001_lsp/
          pytest tests/ --cov=pain001_lsp --cov-branch --cov-report=xml --cov-fail-under=100
          interrogate -c pyproject.toml pain001_lsp
          bandit -r pain001_lsp/ -ll
          pip-audit
