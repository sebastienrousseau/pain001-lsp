# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The manual on every push and pull request, before docs.yml deploys it
# from main: a Sphinx build with every warning an error (a broken
# cross-reference, a missing toctree entry, an autodoc import failure),
# and Sphinx's link check over every external and intra-docs link.
# Reproduce locally with `make docs` and `make linkcheck` after
# `pip install --require-hashes -r requirements/docs.txt` and
# `pip install --no-deps -e .`.
name: Docs check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Sphinx build (warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the hash-pinned Sphinx toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/docs.txt

      - name: Build the manual
        run: make docs PYTHON=python

  linkcheck:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the hash-pinned Sphinx toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/docs.txt

      - name: Check every link in the manual
        run: make linkcheck PYTHON=python
