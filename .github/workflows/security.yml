name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install bandit (hash-pinned)
        run: pip install --require-hashes -r requirements/ci.txt

      - name: Run bandit
        run: bandit -r pain001_lsp/ -ll

  pip-audit:
    name: pip-audit (vulnerable dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      # pip-audit gets a virtual environment of its own, so its pins and
      # Poetry's never have to agree.
      - name: Install Poetry and pip-audit (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/build.txt
          python -m venv .audit
          .audit/bin/pip install --require-hashes -r requirements/audit.txt

      - name: Install the locked environment
        run: poetry install --no-interaction --no-root

      # pip-audit audits the interpreter it runs under unless told
      # otherwise; point it at the Poetry environment's.
      - name: Audit poetry.lock
        run: |
          PIPAPI_PYTHON_LOCATION="$(poetry env info -p)/bin/python" \
            .audit/bin/pip-audit --desc

      - name: Audit requirements/*.txt
        run: |
          for f in requirements/*.txt; do
            echo "== $f"
            .audit/bin/pip-audit --require-hashes --disable-pip --desc -r "$f"
          done
