name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "pain001_lsp/__init__.py"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          # Coordinated development: when a feat/* branch here has a
          # counterpart of the same name in pain001, build against it so
          # the pair can be tested before the core is released.
          #
          # This used to assume every feat/* branch had a counterpart, so
          # any feat/* branch without one died with "pathspec ... did not
          # match any file(s)". The fallback also pinned
          # pain001>=0.0.52,<0.0.54 while this package declares >=0.0.55.
          # Now the branch is used only if it exists, and the fallback
          # honours the floor in pyproject.toml.
          CORE=https://github.com/sebastienrousseau/pain001
          if [[ "$REF" == feat/* ]] && \
             git ls-remote --exit-code --heads "$CORE" "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            FLOOR=$(grep -E '^pain001 = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            pip install "pain001>=${FLOOR}"
          fi
          pip install .
          pip install sphinx furo "myst-parser[linkify]" sphinx-autodoc-typehints sphinx-copybutton

      - name: Build Sphinx documentation
        run: |
          cd docs
          make html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "docs/_build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
